<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Arrival Times</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Bus Arrival Times</h1>
        <div id="main-bus-times">
            <table class="bus-table" id="mainTable">
                <thead>
                    <tr>
                        <th>Bus Stop</th>
                        <th>Bus</th>
                        <th>1st Arrival</th>
                        <th>2nd Arrival</th>
                        <th>3rd Arrival</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Bus rows will be dynamically populated based on settings selections -->
                </tbody>
            </table>
        </div>
        
        <div id="no-selections" class="no-selections" style="display: none;">
            <p>No bus stops selected. Please go to <a href="settings.html">Settings</a> to select bus stops to monitor.</p>
        </div>
        
        <!-- Weather Forecast Section -->
        <div id="weather-forecast" class="weather-section">
            <h2>24-Hour Weather Forecast</h2>
            <table class="weather-table" id="weatherTable">
                <thead>
                    <tr>
                        <th>Time Period</th>
                        <th>West</th>
                        <th>North</th>
                        <th>South</th>
                        <th>East</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Weather rows will be dynamically populated -->
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Settings link in bottom right corner -->
    <a href="settings.html" class="settings-link">⚙️ Settings</a>
    
    <script src="script.js"></script>
</body>
</html>
