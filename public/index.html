<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Arrival Times</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="main-header">
            <h1>Bus Arrival Times</h1>
            <div class="header-weather" id="headerWeather">
                <!-- Weather icons will be dynamically populated -->
            </div>
        </div>
        <div id="main-bus-times">
            <table class="bus-table" id="mainTable">
                <thead>
                    <tr>
                        <th>Bus Stop</th>
                        <th>Bus</th>
                        <th>1st Arrival</th>
                        <th>2nd Arrival</th>
                        <th>3rd Arrival</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Bus rows will be dynamically populated based on settings selections -->
                </tbody>
            </table>
        </div>
        
        <div id="no-selections" class="no-selections" style="display: none;">
            <p>No bus stops selected. Please go to <a href="settings.html">Settings</a> to select bus stops to monitor.</p>
        </div>
        
        <!-- Weather Forecast Section -->
        <div id="weather-forecast" class="weather-section">
            <div class="weather-header" id="weatherHeader">
                <h2>4-Day Weather Outlook</h2>
                <button class="weather-toggle" id="weatherToggle">
                    <span class="toggle-icon">▼</span>
                </button>
            </div>
            <div class="weather-content" id="weatherContent">
                <table class="weather-table" id="weatherTable">
                    <thead>
                        <tr>
                            <th>Metrics</th>
                            <th>Day 1</th>
                            <th>Day 2</th>
                            <th>Day 3</th>
                            <th>Day 4</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Weather rows will be dynamically populated -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Settings link in bottom right corner -->
    <a href="settings.html" class="settings-link">⚙️ Settings</a>
    
    <script src="script.js"></script>
</body>
</html>
