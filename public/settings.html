<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Stop Settings</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .settings-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
        }
        
        .settings-section {
            margin-bottom: 30px;
        }
        
        .settings-section h2 {
            color: #ffffff;
            margin-bottom: 15px;
            font-size: 20px;
        }
        
        .search-container {
            position: relative;
            margin-bottom: 20px;
        }
        
        .search-input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #333333;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.2);
        }
        
        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 250px;
            overflow-y: auto;
            background: #333333;
            border: 1px solid #555;
            border-top: none;
            border-radius: 0 0 6px 6px;
            z-index: 1000;
            display: none;
        }
        
        .search-option {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #444;
            color: #ffffff;
            transition: background-color 0.2s;
        }
        
        .search-option:hover {
            background: #404040;
        }
        
        .search-option:last-child {
            border-bottom: none;
        }
        
        .search-option.selected {
            background: #60a5fa;
        }
        
        .no-results {
            padding: 12px;
            color: #888;
            font-style: italic;
        }
        
        .selection-basket {
            min-height: 120px;
            background: #2a2a2a;
            border: 2px dashed #555;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-start;
        }
        
        .basket-empty {
            color: #888;
            font-style: italic;
            margin: 0;
            text-align: center;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }
        
        .selected-item {
            background: #444444;
            border: 1px solid #666;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            font-size: 14px;
            max-width: 300px;
        }
        
        .selected-item-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .remove-item {
            background: none;
            color: #ff6b6b;
            border: none;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0;
            border-radius: 2px;
            transition: all 0.2s ease;
        }
        
        .remove-item:hover {
            background: rgba(255, 107, 107, 0.1);
            color: #ff4444;
            transform: scale(1.1);
        }
        
        .settings-actions {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .save-button {
            background: #60a5fa;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .save-button:hover {
            background: #3b82f6;
        }
        
        .save-button:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .save-button:disabled:hover {
            background: #555;
        }
        
        .back-link {
            color: #60a5fa;
            text-decoration: none;
            font-size: 16px;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .save-status {
            color: #4ade80;
            font-size: 14px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="settings-container">
        <a href="index.html" class="back-link">← Back to Bus Arrivals</a>
        
        <h1>Bus Stop Settings</h1>
        
        <div class="settings-section">
            <h2>Search Bus Stops</h2>
            <div class="search-container">
                <input type="text" id="busStopSearch" class="search-input" placeholder="Search for bus stops (e.g., 'bukit batok', '43309', 'jurong east')" autocomplete="off">
                <div id="searchDropdown" class="search-dropdown"></div>
            </div>
        </div>

        <div class="settings-section">
            <h2>Selected Bus Stops</h2>
            <div id="selectedBasket" class="selection-basket">
                <p class="basket-empty">No bus stops selected. Search and click on a bus stop to add it here.</p>
            </div>
        </div>

        <div class="settings-actions">
            <button id="saveChanges" class="save-button" disabled>Apply Changes</button>
            <span id="saveStatus" class="save-status" style="display: none;"></span>
            <a href="index.html" class="back-link">Cancel</a>
        </div>
    </div>

    <script src="settings.js"></script>
</body>
</html>
