<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API Test</title>
</head>
<body>
    <h1>4-Day Weather API Test</h1>
    <div id="result"></div>
    
    <script>
        async function testWeatherAPI() {
            try {
                console.log('Fetching 4-day weather data...');
                const response = await fetch('https://api-open.data.gov.sg/v2/real-time/api/four-day-outlook');
                const data = await response.json();
                
                console.log('API Response:', data);
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                
                if (data.code === 0 && data.data && data.data.records && data.data.records.length > 0) {
                    const record = data.data.records[0];
                    const forecasts = record.forecasts || [];
                    console.log('Forecasts:', forecasts);
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = 'Error: ' + error.message;
            }
        }
        
        testWeatherAPI();
    </script>
</body>
</html>
